<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chagent · 本机账户</title><link rel="stylesheet" href="/account-assets/accounts.css"></head><body><main><section class="card"><div class="brand">CHAGENT / LOCAL ACCOUNT</div><h1>本机账户</h1><p class="sub">每位用户独立登录。文件、会话和记忆保存在这台电脑的个人空间中。</p><div id="notice" role="alert"></div>
<div id="signedOut"><form id="login"><h2>登录</h2><label>用户名<input name="username" minlength="3" maxlength="32" autocomplete="username" required></label><label>密码<input name="password" type="password" maxlength="256" autocomplete="current-password" required></label><button>登录</button></form>
<details id="registerHint"><summary>新用户？注册本机账户</summary><form id="register"><label>用户名（3–32 位英文、数字等）<input name="username" minlength="3" maxlength="32" autocomplete="username" required></label><label>密码（至少 12 位）<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>注册普通用户</button></form></details>
<details id="setup" hidden><summary>首次配置管理员</summary><p class="sub">配置码只保存在本机，仅电脑所有者可读取。普通注册不会获得管理员权限。</p><pre id="setupPath"></pre><form id="setupForm"><label>配置码<input name="setup_code" minlength="32" maxlength="128" autocomplete="off" required></label><label>管理员用户名<input name="username" minlength="3" maxlength="32" autocomplete="username" required></label><label>密码<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>创建首次管理员</button></form></details></div>
<div id="signedIn" hidden><h2 id="identity"></h2><p>个人工作区（本机）</p><pre id="workspace"></pre><p id="access"></p><a class="button" href="/">返回应用</a><button class="secondary" id="logout">退出登录</button></div></section>
<section id="admin" class="card" hidden><div class="brand">ADMINISTRATION</div><h2>用户管理</h2><p class="sub">只有管理员可更改角色或停用账户。不能移除最后一位管理员；权限变化会使原登录失效。</p><div id="users"></div></section></main>
<script src="/account-assets/accounts.js" defer></script></body></html>
