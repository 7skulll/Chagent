<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chagent · 本地对话</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- 最左图标栏 -->
  <nav class="rail" aria-label="主导航">
    <div class="rail-top">
      <button class="rail-icon active" title="主页" aria-label="主页">
        <svg viewBox="0 0 24 24"><path d="M3.8 6.2 12 2.6l8.2 3.6v5.2c0 4.9-3.4 8.5-8.2 10-4.8-1.5-8.2-5.1-8.2-10Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-icon" title="库" aria-label="库">
        <svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10.5 4h3v16h-3zM16.4 4.6l2.9-.8 4 15-2.9.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-icon" title="历史" aria-label="历史">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.4V12l3 1.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="rail-icon" title="知识" aria-label="知识">
        <svg viewBox="0 0 24 24"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h12v15H7a2.5 2.5 0 0 0-2.5 2.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.5 20.5A2.5 2.5 0 0 1 7 18h12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="rail-icon" title="收件箱" aria-label="收件箱">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4.5 7 7.5 5.6L19.5 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-icon" title="更多" aria-label="更多">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="rail-bottom">
      <button class="rail-icon" title="工作区" aria-label="工作区" id="open-context">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="6.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="6.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h0m13 6v-1.5A4.5 4.5 0 0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 20v-1a2.5 2.5 0 0 1 5 0v1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="rail-icon" title="应用" aria-label="应用">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="rail-avatar" title="本地用户">GU</div>
    </div>
  </nav>

  <!-- 会话侧栏 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <button class="brand" id="brand" title="Chagent 本地 Agent">
        <strong>Chagent</strong>
        <svg viewBox="0 0 24 24" class="chev"><path d="m6.5 9.5 5.5 5 5.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="head-actions">
        <button class="ghost-icon" title="通知" aria-label="通知">
          <svg viewBox="0 0 24 24"><path d="M12 4a5.4 5.4 0 0 0-5.4 5.4c0 4-1.8 5.4-1.8 5.4h14.4s-1.8-1.4-1.8-5.4A5.4 5.4 0 0 0 12 4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10.3 18.2a1.8 1.8 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="ghost-icon" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m15.6 15.6 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <button id="new-session" class="new-chat" title="开始一段新对话">
      <svg viewBox="0 0 24 24"><path d="m4.5 16.4 10-10a2.1 2.1 0 0 1 3 3l-10 10-4 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      新聊天
    </button>

    <button class="side-row" title="项目（未开放）">
      项目
      <svg viewBox="0 0 24 24" class="chev-r"><path d="m9.5 6.5 5 5.5-5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="section-label">最近</div>
    <nav id="sessions" aria-label="会话列表"></nav>
    <button id="more-sessions" class="load-more" hidden>加载更多会话</button>
    <div class="sidebar-foot"><span id="workspace" class="workspace" title=""></span></div>
  </aside>

  <!-- 中间聊天区 -->
  <main class="chat">
    <header class="tabbar">
      <div class="tabbar-left">
        <button class="ghost-icon" id="toggle-sidebar" title="折叠/展开侧栏" aria-label="折叠或展开侧栏"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button class="ghost-icon" title="前进" aria-label="前进"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="tabbar-title" id="session-title">聊天</div>
      <div class="tabbar-right">
        <div class="fake-tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.6 12h16.8M12 3.6c2.6 2.3 3.9 5 3.9 8.4s-1.3 6.1-3.9 8.4c-2.6-2.3-3.9-5-3.9-8.4s1.3-6.1 3.9-8.4Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          新标签页
          <span class="tab-x">×</span>
        </div>
        <button class="ghost-icon" title="新建标签页" aria-label="新建标签页"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button class="ghost-icon" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M9 4.5H4.5V9M15 4.5h4.5V9M9 19.5H4.5V15M15 19.5h4.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ghost-icon" id="toggle-tools" title="折叠/展开工具面板" aria-label="折叠或展开工具面板"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
    </header>

    <div id="error" role="alert" hidden></div>

    <section id="conversation" aria-label="聊天记录">
      <button id="older" class="load-more in-chat" hidden>加载更早的消息</button>
      <div id="messages"></div>
      <div id="live" aria-live="polite"></div>
      <div id="empty">
        <svg class="empty-logo" viewBox="0 0 96 96" aria-hidden="true">
          <path d="M48 10c7 0 12.4 3.4 15.2 8.6C69 15.4 76 16.6 80.6 21.2c4.6 4.6 5.8 11.6 2.6 17.4C88.6 41.4 92 46.8 92 53.8c0 7-3.4 12.4-8.8 15.2 3.2 5.8 2 12.8-2.6 17.4-4.6 4.6-11.6 5.8-17.4 2.6C60.4 94.4 55 92 48 92s-12.4-2.4-15.2-3c-5.8 3.2-12.8 2-17.4-2.6-4.6-4.6-5.8-11.6-2.6-17.4C7.4 66.2 4 60.8 4 53.8c0-7 3.4-12.4 8.8-15.2-3.2-5.8-2-12.8 2.6-17.4C20 16.6 27 15.4 32.8 18.6 35.6 13.4 41 10 48 10Z" transform="translate(0 -3) scale(.96)" fill="#c9c9ce"/>
          <circle cx="38" cy="48" r="4.4" fill="#fff"/><circle cx="58" cy="48" r="4.4" fill="#fff"/>
          <path d="M40 60c2.6 2.4 5.4 3.4 8 3.4s5.4-1 8-3.4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <h2>你想让我们在 <span class="dotted">Chagent</span> 中构建<br>什么？</h2>
      </div>
    </section>

    <footer class="dock">
      <div class="status-line"><span id="status" role="status">就绪</span><button id="stop" class="stop-btn" hidden>■ 停止生成</button></div>
      <form id="composer" class="composer">
        <div class="composer-toolbar">
          <button type="button" class="tool-chip" title="工作区文件">
            <svg viewBox="0 0 24 24"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3.2c.7 0 1.4.3 1.9.8l1.2 1.2H18A2.5 2.5 0 0 1 20.5 9v8A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="tool-chip" title="宿主命令（默认关闭）">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="toolbar-spacer"></span>
          <button type="button" class="tool-chip" title="设置">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.2v2.3M12 17.5v2.3M4.2 12h2.3M17.5 12h2.3M6.5 6.5l1.6 1.6M15.9 15.9l1.6 1.6M17.5 6.5l-1.6 1.6M8.1 15.9l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <label for="input" class="sr-only">输入消息</label>
        <textarea id="input" rows="2" placeholder="随心输入" maxlength="16000"></textarea>
        <div class="composer-bottom">
          <button type="button" class="round-btn" title="添加"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <button type="button" class="round-btn" id="open-memory" title="长期记忆"><svg viewBox="0 0 24 24"><path d="M8.2 13.4c1.3-1.3 2-2.9 1.6-4.5-.5-2-2.6-3-4.4-2.2-1.8.8-2.5 3-1.7 4.9.9 2.1 3 3.5 4.5 1.8ZM12 12c2 3.6 6.5 3.6 8.4.4 1.6-2.7.3-6.3-2.7-7.2-2.6-.8-5.2.7-5.7 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 18.5c3.8 1.6 8.2 1.6 12 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <span class="toolbar-spacer"></span>
          <span id="model" class="model-pill" title="当前模型"></span>
          <button type="button" class="round-btn" title="语音（未开放）"><svg viewBox="0 0 24 24"><rect x="9.2" y="3.5" width="5.6" height="10.5" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.7v2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <button id="send" type="submit" class="send-btn" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <div class="dock-hint">本地工作区 · 工具操作会记录在会话中</div>
    </footer>
  </main>

  <!-- 右侧工具面板 -->
  <aside class="tools-panel" aria-label="工具面板">
    <div class="browser-bar">
      <button class="ghost-icon" title="后退" aria-label="后退"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ghost-icon" title="前进" aria-label="前进"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ghost-icon" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2-4.9M19 4.5V8h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="url-pill">搜索或输入网址</div>
      <button class="ghost-icon" title="更多" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/></svg></button>
    </div>
    <div class="tools-body">
      <h3>工具</h3>
      <button class="tool-card" title="多文件补丁工具 apply_patch">
        <span class="tool-ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 12h7M12 8.5v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        变更
        <kbd>⇧⌘G</kbd>
      </button>
      <button class="tool-card" title="宿主命令与测试运行 exec_command / run_tests">
        <span class="tool-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        终端
        <span class="tool-extra"><kbd>⌥`</kbd><svg viewBox="0 0 24 24" class="dots"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></svg></span>
      </button>
      <button class="tool-card" title="文件读取与写入 read_file / write_file / edit_file">
        <span class="tool-ico"><svg viewBox="0 0 24 24"><path d="M6 3.5h8L19 8.5v12H6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 3.5V9H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
        文件
        <kbd>⌘P</kbd>
      </button>
      <details id="context-panel">
        <summary>上下文与会话摘要</summary>
        <div id="context-info">选择会话后可查看。</div>
      </details>
    </div>
  </aside>

  <dialog id="memory-dialog" aria-labelledby="memory-heading">
    <div class="memory-heading"><div><h2 id="memory-heading">长期记忆</h2><p>用户偏好跨工作区使用，项目事实仅用于当前工作区。</p></div><button id="close-memory" class="quiet" aria-label="关闭记忆">关闭 ×</button></div>
    <div id="memory-notice" role="status"></div>
    <div class="memory-toolbar"><label for="memory-filter">查看</label><select id="memory-filter"><option value="active">已生效</option><option value="candidate">待审核</option><option value="deleted">已删除</option><option value="rejected">已拒绝</option></select><button id="new-memory">＋ 添加记忆</button></div>
    <form id="memory-editor" hidden>
      <label for="memory-scope">作用范围</label><select id="memory-scope"><option value="workspace">当前工作区</option><option value="user">用户偏好（所有工作区）</option></select>
      <label for="memory-key">记忆键</label><input id="memory-key" required maxlength="80" placeholder="例如 response.language 或 project.framework">
      <label for="memory-content">内容</label><textarea id="memory-content" required maxlength="2000" rows="3"></textarea>
      <label class="memory-pin"><input id="memory-pinned" type="checkbox"> 优先保留，即使本轮没有匹配关键词</label>
      <div><button type="submit">保存</button><button type="button" id="cancel-memory-edit" class="quiet">取消编辑</button></div>
    </form>
    <div id="memory-list"></div><button id="more-memories" class="quiet" hidden>加载更多记忆</button>
    <p class="memory-footnote">自动提取的候选审核后才生效。删除会停止后续检索，原始聊天与版本审计仍保留。</p>
  </dialog>
</body>
</html>
