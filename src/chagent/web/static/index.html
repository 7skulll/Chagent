<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chagent 是一个在本机运行、可检查上下文与长期记忆的对话式编码助手。">
  <title>Chagent · 本地对话</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Hallmark · checked: 2026-10-30 · genre: app screen · scope: app · v2.0.0 */
    /* Critical rules: the page still focuses and never scrolls sideways when
       the sheet above fails to load.
       waive 26b: :active / :disabled and the other control states are declared
       in style.css; this block is critical-path fallback only. */
    html,body{overflow-x:clip}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  </style>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- 会话侧栏：唯一的一级导航。图标栏在 Z1 删到只剩一个工作区按钮（侧栏底部已有
       同名控件），剩下的 60px 只是死掉的壳；头像则是一个不存在的用户。两者都已移除。 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand"><strong>Chagent</strong></div>
    </div>

    <label for="session-search" class="sr-only">搜索会话</label>
    <input id="session-search" class="session-search" type="search" placeholder="搜索会话标题" maxlength="200" autocomplete="off">

    <button id="new-session" class="new-chat" title="开始一段新对话">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4.5 16.4 10-10a2.1 2.1 0 0 1 3 3l-10 10-4 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      新聊天
    </button>

    <div class="section-label" id="sessions-label">最近</div>
    <nav id="sessions" aria-label="会话列表"></nav>
    <button id="more-sessions" class="load-more" hidden>加载更多会话</button>
    <div class="sidebar-foot">
      <button id="workspace-button" class="workspace" title="切换工作区">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3.2c.7 0 1.4.3 1.9.8l1.2 1.2H18A2.5 2.5 0 0 1 20.5 9v8A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="workspace-label"><span id="workspace-parent"></span><span id="workspace"></span></span>
      </button>
      <button id="archived-toggle" class="archived-toggle" aria-pressed="false">已归档 <span id="archived-count">0</span></button>
    </div>
  </aside>

  <div id="scrim" class="scrim" aria-hidden="true"></div>

  <!-- 中间聊天区 -->
  <main class="chat">
    <header class="tabbar">
      <div class="tabbar-left">
        <button class="ghost-icon" id="toggle-sidebar" title="折叠/展开侧栏" aria-label="折叠或展开侧栏"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
      <div class="tabbar-title" id="session-title">聊天</div>
      <div class="tabbar-right">
        <button class="usage-pill" id="usage-pill" title="本会话 token 用量" hidden>用量</button>
        <button class="ghost-icon" id="toggle-tools" title="折叠/展开工具面板" aria-label="折叠或展开工具面板"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
    </header>

    <div id="error" role="alert" hidden></div>

    <section id="conversation" aria-label="聊天记录">
      <button id="older" class="load-more in-chat" hidden>加载更早的消息</button>
      <div id="messages"></div>
      <div id="live" aria-live="polite"></div>
      <div id="empty">
        <svg class="empty-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <path d="M48 10c7 0 12.4 3.4 15.2 8.6C69 15.4 76 16.6 80.6 21.2c4.6 4.6 5.8 11.6 2.6 17.4C88.6 41.4 92 46.8 92 53.8c0 7-3.4 12.4-8.8 15.2 3.2 5.8 2 12.8-2.6 17.4-4.6 4.6-11.6 5.8-17.4 2.6C60.4 94.4 55 92 48 92s-12.4-2.4-15.2-3c-5.8 3.2-12.8 2-17.4-2.6-4.6-4.6-5.8-11.6-2.6-17.4C7.4 66.2 4 60.8 4 53.8c0-7 3.4-12.4 8.8-15.2-3.2-5.8-2-12.8 2.6-17.4C20 16.6 27 15.4 32.8 18.6 35.6 13.4 41 10 48 10Z" transform="translate(0 -3) scale(.96)" fill="currentColor"/>
          <circle class="eye" cx="38" cy="48" r="4.4"/><circle class="eye" cx="58" cy="48" r="4.4"/>
          <path class="mouth" d="M40 60c2.6 2.4 5.4 3.4 8 3.4s5.4-1 8-3.4" fill="none" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <div class="empty-intro">
          <h2>你想在 Chagent 中构建什么？</h2>
          <p>工具只作用于当前工作区，每次调用都记录在这个会话里。</p>
        </div>
        <div class="starters" id="starters" aria-label="起手式"></div>
      </div>
    </section>

    <footer class="dock">
      <div class="status-line"><span id="status" role="status">就绪</span><button id="stop" class="stop-btn" hidden>■ 停止生成</button></div>
      <form id="composer" class="composer">
        <label for="input" class="sr-only">输入消息</label>
        <textarea id="input" rows="2" placeholder="随心输入" maxlength="16000"></textarea>
        <div class="composer-bottom">
          <button type="button" class="round-btn" id="attach" title="上传文档（PDF / Word / Excel / 文本）"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <input type="file" id="file-input" hidden>
          <button type="button" class="round-btn" id="open-memory" title="长期记忆"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.2 13.4c1.3-1.3 2-2.9 1.6-4.5-.5-2-2.6-3-4.4-2.2-1.8.8-2.5 3-1.7 4.9.9 2.1 3 3.5 4.5 1.8ZM12 12c2 3.6 6.5 3.6 8.4.4 1.6-2.7.3-6.3-2.7-7.2-2.6-.8-5.2.7-5.7 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 18.5c3.8 1.6 8.2 1.6 12 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button type="button" class="round-btn tool-chip" id="open-config" title="运行时配置"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.2v2.3M12 17.5v2.3M4.2 12h2.3M17.5 12h2.3M6.5 6.5l1.6 1.6M15.9 15.9l1.6 1.6M17.5 6.5l-1.6 1.6M8.1 15.9l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <span class="toolbar-spacer"></span>
          <span id="model" class="model-pill" title="当前模型"></span>
          <button id="send" type="submit" class="send-btn" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <!-- 右侧工具面板 -->
  <aside class="tools-panel" aria-label="上下文面板">
    <div class="tools-body">
      <details id="context-panel" open>
        <summary>上下文与会话摘要</summary>
        <div id="context-info">选择会话后可查看。</div>
      </details>
    </div>
  </aside>

  <dialog id="memory-dialog" aria-labelledby="memory-heading">
    <div class="memory-heading"><div><h2 id="memory-heading">长期记忆</h2><p>用户偏好跨工作区使用，项目事实仅用于当前工作区。</p></div><button id="close-memory" class="quiet" aria-label="关闭记忆">关闭 ×</button></div>
    <div id="memory-notice" role="status"></div>
    <div class="memory-toolbar"><label for="memory-filter">查看</label><select id="memory-filter"><option value="active">已生效</option><option value="candidate">待审核</option><option value="deleted">已删除</option><option value="rejected">已拒绝</option></select><button id="new-memory">＋ 添加记忆</button></div>
    <form id="memory-editor" hidden>
      <label for="memory-scope">作用范围</label><select id="memory-scope"><option value="workspace">当前工作区</option><option value="user">用户偏好（所有工作区）</option></select>
      <label for="memory-key">记忆键</label><input id="memory-key" required maxlength="80" placeholder="例如 response.language 或 project.framework">
      <label for="memory-content">内容</label><textarea id="memory-content" required maxlength="2000" rows="3"></textarea>
      <label class="memory-pin"><input id="memory-pinned" type="checkbox"> 优先保留，即使本轮没有匹配关键词</label>
      <div><button type="submit">保存</button><button type="button" id="cancel-memory-edit" class="quiet">取消编辑</button></div>
    </form>
    <div id="memory-list"></div><button id="more-memories" class="quiet" hidden>加载更多记忆</button>
    <p class="memory-footnote">自动提取的候选审核后才生效。删除会停止后续检索，原始聊天与版本审计仍保留。</p>
  </dialog>

  <dialog id="workspace-dialog" aria-labelledby="workspace-heading">
    <div class="memory-heading"><div><h2 id="workspace-heading">工作区</h2><p>会话、上传与文件工具都限定在选中的目录内。</p></div><button id="close-workspace" class="quiet" aria-label="关闭工作区">关闭 ×</button></div>
    <div id="workspace-notice" role="status"></div>
    <div id="workspace-list" class="workspace-list"></div>
    <form id="workspace-form">
      <label for="workspace-path">打开其他目录</label>
      <input id="workspace-path" placeholder="~/projects/example" required maxlength="4096">
      <button type="submit">打开</button>
    </form>
    <p class="memory-footnote">打开过的目录列在上方，按最近活跃排序；服务重启后需要重新打开一次。</p>
  </dialog>

  <dialog id="config-dialog" aria-labelledby="config-heading">
    <div class="memory-heading"><div><h2 id="config-heading">运行时配置</h2><p>来自环境变量与启动参数，网页内只读。</p></div><button id="close-config" class="quiet" aria-label="关闭配置">关闭 ×</button></div>
    <div id="config-notice" role="status"></div>
    <dl id="config-list"></dl>
    <h3 class="dialog-section">本机用量（近 7 天）</h3>
    <div id="config-usage"></div>
  </dialog>

  <dialog id="usage-dialog" aria-labelledby="usage-heading">
    <div class="memory-heading"><div><h2 id="usage-heading">本会话 token 用量</h2><p>供应商回报的计数，按运行汇总；不含金额。</p></div><button id="close-usage" class="quiet" aria-label="关闭用量">关闭 ×</button></div>
    <div id="usage-notice" role="status"></div>
    <div id="usage-summary"></div>
    <div id="usage-table"></div>
  </dialog>
</body>
</html>
