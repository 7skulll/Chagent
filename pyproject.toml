[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "chagent"
version = "0.1.0"
description = "Local agent with inspectable context and memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4,<5",
    "pillow>=12,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pypdfium2>=5,<6",
    "uvicorn>=0.35,<1",
]

# The browser is the entry point: `chagent` starts the local web app and opens
# it. The frozen command-line runner stays reachable as `python -m chagent.cli`.
[project.scripts]
chagent = "chagent.web.__main__:main"

[project.optional-dependencies]
# Readers for binary documents behind read_file. Optional because text-only work
# never pays for them, and a missing reader is reported as an install hint on
# the call that needs it, not as a startup failure. Token counting is a heuristic
# on purpose (see chagent.context.tokens) and needs no extra.
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/chagent"]
