[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "chagent"
version = "0.1.0"
description = "Local agent with inspectable context and memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4,<5",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chagent"]
