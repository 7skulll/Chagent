services:
  db:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_DB: chagent
      POSTGRES_USER: chagent
      POSTGRES_PASSWORD: chagent-local
    volumes:
      - chagent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chagent -d chagent"]
      interval: 2s
      timeout: 2s
      retries: 30

  chagent:
    image: chagent:local
    build: .
    env_file:
      - .env
    environment:
      CHAGENT_DATABASE_URL: postgresql://chagent:chagent-local@db/chagent
      CHAGENT_EXECUTION_PROFILE: containerized
      CHAGENT_BOUNDARY: container
      CHAGENT_IMAGE: chagent:local
      CHAGENT_CONTAINER_DECLARED: "true"
      CHAGENT_WORKSPACE_ROOT: /workspaces
      CHAGENT_HOST_WORKSPACE_PATH: ${CHAGENT_WORKSPACES}
      CHAGENT_SANDBOX: "off"
      CHAGENT_SANDBOX_NETWORK: "true"
      CHAGENT_SANDBOX_WRITABLE: "true"
      CHAGENT_CODE_MODE: "on"
      CHAGENT_ALLOW_HOST_COMMANDS: "true"
      # The workspace is a bind mount of the host directory, so a command and an
      # overwrite both land on the user's machine. Ask by default; set
      # CHAGENT_APPROVAL=never explicitly for an unattended run.
      CHAGENT_APPROVAL: "untrusted"
      # Optional, explicit host execution channel. Start the host agent first.
      CHAGENT_HOST_EXEC: ${CHAGENT_HOST_EXEC:-off}
      CHAGENT_HOST_ENDPOINT: ${CHAGENT_HOST_ENDPOINT:-http://host.docker.internal:8766}
      CHAGENT_HOST_TOKEN: ${CHAGENT_HOST_TOKEN:-}
    volumes:
      - type: bind
        source: ${CHAGENT_WORKSPACES:?Set CHAGENT_WORKSPACES to an existing absolute directory}
        target: /workspaces
      - chagent-maven:/tmp/.m2
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chagent-db:
  chagent-maven:
